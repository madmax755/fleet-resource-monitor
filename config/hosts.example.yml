# Inventory for always-on Tailscale fleet hosts.
# Copy to hosts.yml and edit IPs/users as needed.
#
# Recommended: direct Tailscale SSH from the Pi (no ProxyJump).
# Optional: set proxy_jump to an inventory name (e.g. server1) or a full
# user@host jump string if a host is only reachable via a jump.

hosts:
  - name: server1
    host: 100.100.126.125
    user: max-kendall

  - name: proxmox
    host: 100.78.145.98
    user: root

  - name: omv
    host: 100.78.70.66
    user: root

  - name: immich
    host: 100.97.234.26
    user: root

  - name: nextcloud
    host: 100.90.192.46
    user: root

  - name: vaultwarden
    host: 100.115.59.95
    user: root

  - name: code
    host: 100.119.32.41
    user: root

  - name: registry
    host: 100.81.62.22
    user: root

  - name: action-runner
    host: 100.92.207.53
    user: root

  - name: sortedautos
    host: 100.99.82.27
    user: root

  - name: vps
    host: 100.67.157.72
    user: sterling

  - name: crays
    host: 100.123.66.67
    user: root

  # Self-check the Pi running this container (no SSH).
  - name: pi
    host: localhost
    user: local
    local: true
    extra_mounts:
      - /media/drive1
